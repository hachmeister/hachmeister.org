{% extends "base.html" %}

{% block content %}
<main itemscope itemtype="https://schema.org/WebPage">
    <header class="page-header">
        <div class="container">
            <div class="row">
                <div class="col twelve">
                    <h1 itemprop="name">{{ section.title }}</h1>
                </div>
            </div>
        </div>
    </header>
    <section class="section">
        <div class="container">
            <div class="row">
                <div class="col twelve">
                    {{ section.content | safe }}
                </div>
            </div>
        </div>
    </section>
</main>
{% endblock %}
